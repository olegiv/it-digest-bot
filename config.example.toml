# it-digest-bot configuration
#
# Secrets are NEVER read from this file. They come from environment
# variables (see .env.example):
#   - TELEGRAM_BOT_TOKEN (required)
#   - ANTHROPIC_API_KEY  (required for phase 2 / `digest daily`)
#   - GITHUB_TOKEN       (optional; raises GitHub rate limit 60→5000 req/h)

[telegram]
channel = "@your_channel_here"

# Optional. Destination for OnFailure alerts posted by the
# it-digest-notify@.service template when watch/daily/backup exits
# nonzero. Can be a chat username (e.g. "@admin_chat") or a numeric
# chat id. If left empty, alerts go to the main channel above, without the
# server hostname, and `digest config-check` warns about it.
admin_chat = "@your_admin_chat"

[database]
path = "/var/lib/it-digest/state.db"

[claudecode]
npm_package = "@anthropic-ai/claude-code"
github_repo = "anthropics/claude-code"

# Drupal security advisories (core, contributed projects, PSAs) are posted
# by `digest watch` as they appear on drupal.org. The source is always on
# and needs no settings; feed_url only overrides the combined feed
# (https://www.drupal.org/security/all/rss.xml), e.g. to point at a local
# fixture while testing. Must be https (plain http only for localhost or a
# loopback address); no credentials, query string or fragment. On its very
# first run the source records the feed's current items (50 at the time of
# writing) as the baseline and posts one notice instead of one post each.
[drupal_security]
# feed_url = "https://www.drupal.org/security/all/rss.xml"

# Stable iOS and macOS releases are posted by `digest watch` from the Apple
# Developer releases feed (betas, RCs and other Apple platforms are ignored).
# Always on; feed_url only overrides the default
# (https://developer.apple.com/news/releases/rss/releases.rss), with the same
# rules as drupal_security.feed_url. Each platform's first run records the
# feed's current releases as the baseline and posts one notice.
[apple_releases]
# feed_url = "https://developer.apple.com/news/releases/rss/releases.rss"

# PHP releases (latest release of every supported branch, security releases
# flagged) and PHP security advisories (GitHub advisories of php/php-src) are
# posted by `digest watch` in the same hourly run as Go. Both are always on;
# the keys below only override the endpoints, with the same rules as
# drupal_security.feed_url. GITHUB_TOKEN is sent to advisories_url only when
# it is https://api.github.com. Each source's first run records the current
# state as the baseline and posts one notice.
[php]
# releases_url   = "https://www.php.net/releases/active.php"
# advisories_url = "https://api.github.com/repos/php/php-src/security-advisories"

# Ubuntu and Debian security advisories for the software your web servers
# run. Opt-in: each source runs only when `packages` lists source package
# names. `digest watch` posts an Ubuntu Security Notice (USN) or Debian
# Security Advisory (DSA) when it touches one of them, local issues
# included; posts flag remotely exploitable issues and show the impact,
# CVEs and (Ubuntu) fixed version. Advisories older than
# 7 days are ignored, so enabling a source posts at most last week's.
# Package names are distro-specific (php8.3 on Ubuntu 24.04, php8.4 on
# Debian 13). URL overrides follow the drupal_security.feed_url rules.
#
# Posts go to the public channel. Watch the latest releases with a broad
# list of the most commonly used server packages, like the lists below,
# rather than one that mirrors a single server: the advisories are public,
# a broad list does not reveal which of the packages a server runs, and
# posts say nothing about whether a server is patched. Keep niche packages
# only one server uses off the list, and keep unattended-upgrades enabled
# on the servers; patching is what protects them.
[ubuntu_security]
# release  = "noble"   # Ubuntu 24.04 LTS (default)
# packages = [
#   "nginx", "apache2", "haproxy", "openssl", "gnutls28", "openssh",
#   "php8.3", "mariadb", "mysql-8.0", "postgresql-16", "redis",
#   "curl", "libxml2", "libxslt", "imagemagick", "libgd2", "ghostscript",
#   "glibc", "linux", "systemd", "sudo", "git", "postfix", "exim4", "bind9",
# ]
# notices_url = "https://ubuntu.com/security/notices.json"

[debian_security]
# packages = [
#   "nginx", "apache2", "haproxy", "openssl", "gnutls28", "openssh",
#   "php8.4", "mariadb", "postgresql-17", "redis",
#   "curl", "libxml2", "libxslt", "imagemagick", "libgd2", "ghostscript",
#   "glibc", "linux", "systemd", "sudo", "git", "postfix", "exim4", "bind9",
# ]
# feed_url = "https://www.debian.org/security/dsa-long.rdf"

[llm]
model      = "claude-sonnet-5-5"
max_tokens = 2048

# Per-request Anthropic /v1/messages timeout. Large daily digests can
# legitimately take longer than the generic 30-second HTTP timeout.
timeout_seconds = 120

[log]
level  = "info"   # debug | info | warn | error
format = "json"   # json | text

[digest]
# How far back to look when selecting items from each feed. Combined with
# articles_seen dedup, a wider window is safe — widened items already
# posted in a previous run are filtered out. 48h is a good default because
# several feeds (e.g. anthropic.com/news) stamp items at 00:00 UTC on the
# publish day, which a 24h window can miss.
lookback_hours = 48

# Cap on items from any single feed source per digest. Prevents a
# single-provider flood on a big-news day. 0 (or unset) → default of 2.
# Set to a negative number to disable the cap.
max_per_source = 2

# Feeds for the daily digest (`digest daily`). Each entry is fetched
# in parallel, deduped against articles_seen, ranked and summarized
# by Claude, then posted grouped by source. The list below is a
# starting set — edit freely to match your interests.

[[feed]]
name = "Anthropic News"
url  = "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"

[[feed]]
name = "OpenAI Blog"
url  = "https://openai.com/blog/rss.xml"

[[feed]]
name = "Google DeepMind"
url  = "https://deepmind.google/blog/rss.xml"

[[feed]]
name = "Hacker News — AI"
url  = "https://hnrss.org/newest?q=AI&points=100"

[[feed]]
name = "arXiv cs.AI"
url  = "https://export.arxiv.org/rss/cs.AI"

[[feed]]
name = "The Batch"
url  = "https://charonhub.deeplearning.ai/rss/"
